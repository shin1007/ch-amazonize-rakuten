name = "amazon-rakuten-link"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# 楽天アプリ登録の「許可されたWebサイト」と同じ値（https:// 付き）
ALLOWED_ORIGIN = "https://amazon-rakuten-link.shin1007.workers.dev"
# バリューコマースの sid（サイト: nesage.party）/ pid（広告: Yahoo!ショッピング）。リンクに出る公開の値なので Secret にしない
YAHOO_VC_SID = "3784101"
YAHOO_VC_PID = "892723409"

# Secret（wrangler secret put で登録）:
#   RAKUTEN_APP_ID, RAKUTEN_ACCESS_KEY, RAKUTEN_AFFILIATE_ID(任意)
#   YAHOO_APP_ID（Yahoo!デベロッパーネットワークのClient ID。無いと /yahoo は 503 not_configured）
#   （バリューコマースの YAHOO_VC_SID / YAHOO_VC_PID は上の [vars]。あればリンクをMyLinkで包む）

# プライバシーポリシーHTMLを文字列としてimport
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# 中継の結果のキャッシュ（全データセンター共通）。成功は1時間、失敗は1〜10分
[[kv_namespaces]]
binding = "RELAY_CACHE"
id = "ba97a8a0fa0b41c6bd4432fcd25177ca"

# 接続元IPごとのレート制限（公開後の濫用対策）
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60
