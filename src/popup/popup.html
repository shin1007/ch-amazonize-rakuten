<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Amazonize Rakuten</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <h1>Amazonize Rakuten</h1>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span>有効</span>
    </label>
  </header>

  <p id="consentNotice" class="consent" hidden>自動で行う操作（クーポンの自動獲得など）は、まだ有効になっていません。 <a href="../welcome/welcome.html" target="_blank">確認して有効にする</a></p>

  <section>
    <h2>表示</h2>
    <label><input type="checkbox" data-key="simplifyItem"> 商品ページをAmazon風にする</label>
    <label><input type="checkbox" data-key="simplifySearch"> 検索結果の広告を目立たなくする</label>
    <label><input type="checkbox" data-key="nesagePromo"> Amazonのほしい物リストで値下げ通知（nesage.party）を案内する</label>
  </section>

  <section>
    <h2>ほかのサイトの価格を出す</h2>
    <div class="sites"><span>楽天の商品ページ</span>
      <label><input type="checkbox" data-key="amazonPrice"> Amazon</label>
      <label><input type="checkbox" data-key="yahooPrice"> Yahoo!ショッピング</label></div>
    <div class="sites"><span>Amazonの商品ページ</span>
      <label><input type="checkbox" data-key="rakutenLink"> 楽天</label>
      <label><input type="checkbox" data-key="amazonPageYahoo"> Yahoo!ショッピング</label></div>
    <div class="sites"><span>Yahoo!ショッピングの商品ページ</span>
      <label><input type="checkbox" data-key="yahooItem"> Amazon</label>
      <label><input type="checkbox" data-key="yahooPageRakuten"> 楽天</label></div>
  </section>

  <section>
    <h2>かご・クーポン</h2>
    <label><input type="checkbox" data-key="cartTotal"> かごの合計金額を表示</label>
    <label><input type="checkbox" data-key="couponList"> 商品ページにクーポンを表示</label>
    <label class="sub"><input type="checkbox" data-key="couponAutoGrab"> 開いたときに自動で獲得する</label>
    <label><input type="checkbox" data-key="couponAutoApply"> 購入手続きで最良クーポンを適用</label>
    <label class="sub"><input type="checkbox" data-key="couponAutoApplyConfirm"> 適用前に確認する</label>

    <details class="campaigns">
      <summary>獲得したクーポン <span id="acquiredCount"></span></summary>
      <ul id="acquiredList" class="campaign-list"></ul>
    </details>
  </section>

  <section>
    <h2>キャンペーン</h2>
    <label><input type="checkbox" data-key="campaignEntry"> エントリーパネルを表示</label>
    <label><input type="checkbox" data-key="campaignAutoEntry"> 開いたページで自動エントリー</label>
    <label><input type="checkbox" data-key="campaignScanEntry"> 見つけたらエントリーまでする</label>
    <label><input type="checkbox" data-key="campaignScanOnTop"> 楽天のページを開いたら自動で探す（12時間おき）</label>
    <label class="sub"><input type="checkbox" data-key="campaignTabFallback"> 判定できないページはタブで開き直す（タブが見えます）</label>
    <button id="scanCampaigns" class="primary">トップから探してエントリー</button>
    <p class="status" id="scanStatus"></p>

    <details class="campaigns">
      <summary>エントリー済み一覧 <span id="enteredCount"></span></summary>
      <ul id="campaignList" class="campaign-list"></ul>
    </details>

    <details class="campaigns">
      <summary>URLを指定して実行</summary>
      <textarea id="campaignUrls" rows="4" spellcheck="false"
        placeholder="https://event.rakuten.co.jp/campaign/&#10;1行に1URL"></textarea>
      <button id="batchEntry">この一覧でエントリー</button>
      <p class="status" id="status"></p>
    </details>
  </section>

  <!-- 開発版（ストア以外から読み込んだとき）だけ出す。仕組みは src/lib/health.js -->
  <section id="health" hidden>
    <h2>サイト変化チェック（開発版）</h2>
    <p class="status" id="healthSummary"></p>
    <ul id="healthList" class="campaign-list"></ul>
    <details class="campaigns">
      <summary>問題なし <span id="healthOkCount"></span></summary>
      <ul id="healthOkList" class="campaign-list"></ul>
    </details>
    <button id="healthCopy">修正リストをコピー</button>
    <button id="healthNotify" hidden>通知を受け取る</button>
    <button id="healthSeen">警告を既読にする</button>
    <button id="healthClear">記録を消す</button>
  </section>

  <footer>
    <label class="lang">言語 <select id="language"></select></label>
    <label class="sub"><input type="checkbox" data-key="debug"> デバッグログ</label>
    <label class="sub"><input type="checkbox" data-key="noAffiliate"> アフィリエイトIDを付けない（開発用）</label>
    <p class="note">設定の変更はページを再読み込みすると反映されます。</p>
  </footer>

  <script src="../lib/settings.js"></script>
  <script src="../lib/health.js"></script>
  <script src="../lib/i18n-data.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
